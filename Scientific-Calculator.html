<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px;
        }
        
        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            gap: 20px;
        }
        
        .calculator-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .calculator {
            background-color: #2c3e50;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
        }
        
        .display {
            background-color: #1a252f;
            color: white;
            padding: 25px 20px;
            text-align: right;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-bottom: 1px solid #34495e;
        }
        
        .previous-operand {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            min-height: 27px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .current-operand {
            font-size: 2.5rem;
            font-weight: 500;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background-color: #34495e;
        }
        
        button {
            border: none;
            background-color: #34495e;
            color: white;
            padding: 18px 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button:hover {
            background-color: #3d566e;
        }
        
        button:active {
            background-color: #2c3e50;
            transform: scale(0.98);
        }
        
        .operator {
            background-color: #3498db;
        }
        
        .operator:hover {
            background-color: #2980b9;
        }
        
        .function {
            background-color: #9b59b6;
        }
        
        .function:hover {
            background-color: #8e44ad;
        }
        
        .equals {
            background-color: #e74c3c;
            grid-column: span 2;
        }
        
        .equals:hover {
            background-color: #c0392b;
        }
        
        .clear, .delete {
            background-color: #e67e22;
        }
        
        .clear:hover, .delete:hover {
            background-color: #d35400;
        }
        
        .memory {
            background-color: #16a085;
        }
        
        .memory:hover {
            background-color: #1abc9c;
        }
        
        .ad-space {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .ad-slot {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 250px;
        }
        
        .ad-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .ad-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px dashed #bdc3c7;
            color: #7f8c8d;
        }
        
        .ad-content i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #3498db;
        }
        
        .ad-content h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .ad-content p {
            font-size: 0.9rem;
            max-width: 80%;
        }
        
        .calculator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a252f;
            color: white;
            border-radius: 20px 20px 0 0;
        }
        
        .calculator-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .calculator-mode {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .mode-btn {
            background: #34495e;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #3498db;
        }
        
        @media (max-width: 1000px) {
            .container {
                flex-direction: column;
            }
            
            .ad-space {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .ad-slot {
                flex: 1;
                min-width: 250px;
            }
        }
        
        @media (max-width: 600px) {
            .buttons {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .scientific {
                grid-template-columns: repeat(5, 1fr);
            }
            
            button {
                padding: 15px 5px;
                font-size: 1rem;
            }
            
            .current-operand {
                font-size: 2rem;
            }
            
            .ad-space {
                flex-direction: column;
            }
            
            .ad-slot {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator-container">
            <div class="calculator">
                <div class="calculator-header">
                    <div class="calculator-title">Scientific Calculator</div>
                    <div class="calculator-mode">
                        <button class="mode-btn active">DEG</button>
                        <button class="mode-btn">RAD</button>
                    </div>
                </div>
                <div class="display">
                    <div class="previous-operand"></div>
                    <div class="current-operand">0</div>
                </div>
                <div class="buttons">
                    <button class="function">sin</button>
                    <button class="function">cos</button>
                    <button class="function">tan</button>
                    <button class="function">log</button>
                    <button class="function">ln</button>
                    
                    <button class="function">sinh</button>
                    <button class="function">cosh</button>
                    <button class="function">tanh</button>
                    <button class="function">x²</button>
                    <button class="function">√</button>
                    
                    <button class="function">π</button>
                    <button class="function">e</button>
                    <button class="function">x!</button>
                    <button class="function">x^y</button>
                    <button class="function">10^x</button>
                    
                    <button class="memory">MC</button>
                    <button class="memory">MR</button>
                    <button class="memory">M+</button>
                    <button class="memory">M-</button>
                    <button class="memory">MS</button>
                    
                    <button class="clear">AC</button>
                    <button class="delete">DEL</button>
                    <button class="operator">(</button>
                    <button class="operator">)</button>
                    <button class="operator">÷</button>
                    
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="operator">×</button>
                    <button class="function">x^3</button>
                    
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operator">-</button>
                    <button class="function">∛</button>
                    
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="operator">+</button>
                    <button class="function">|x|</button>
                    
                    <button>0</button>
                    <button>.</button>
                    <button class="function">±</button>
                    <button class="equals">=</button>
                    <button class="function">%</button>
                </div>
            </div>
        </div>
        
        <div class="ad-space">
            <div class="ad-slot">
                <div class="ad-label">Advertisement</div>
                <div class="ad-content">
                    <i class="fas fa-ad"></i>
                    <h3>Ad Space</h3>
                    <p>This space is available for advertisements</p>
                </div>
            </div>
            <div class="ad-slot">
                <div class="ad-label">Advertisement</div>
                <div class="ad-content">
                    <i class="fas fa-ad"></i>
                    <h3>Ad Space</h3>
                    <p>This space is available for advertisements</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ScientificCalculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.clear();
                this.memory = 0;
                this.isRadians = false;
            }
            
            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
                this.isResult = false;
            }
            
            delete() {
                if (this.currentOperand === '0' || this.isResult) return;
                if (this.currentOperand.length === 1) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.slice(0, -1);
                }
            }
            
            appendNumber(number) {
                if (this.shouldResetScreen || this.isResult) {
                    this.currentOperand = '';
                    this.shouldResetScreen = false;
                    this.isResult = false;
                }
                
                if (number === '.' && this.currentOperand.includes('.')) return;
                
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number;
                } else {
                    this.currentOperand += number;
                }
            }
            
            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                
                if (this.previousOperand !== '') {
                    this.compute();
                }
                
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.shouldResetScreen = true;
            }
            
            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            alert("Cannot divide by zero!");
                            return;
                        }
                        computation = prev / current;
                        break;
                    case 'x^y':
                        computation = Math.pow(prev, current);
                        break;
                    default:
                        return;
                }
                
                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetScreen = true;
                this.isResult = true;
            }
            
            executeFunction(func) {
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(current)) return;
                
                let computation;
                
                switch (func) {
                    case 'sin':
                        computation = this.isRadians ? Math.sin(current) : Math.sin(current * Math.PI / 180);
                        break;
                    case 'cos':
                        computation = this.isRadians ? Math.cos(current) : Math.cos(current * Math.PI / 180);
                        break;
                    case 'tan':
                        computation = this.isRadians ? Math.tan(current) : Math.tan(current * Math.PI / 180);
                        break;
                    case 'sinh':
                        computation = Math.sinh(current);
                        break;
                    case 'cosh':
                        computation = Math.cosh(current);
                        break;
                    case 'tanh':
                        computation = Math.tanh(current);
                        break;
                    case 'log':
                        if (current <= 0) {
                            alert("Logarithm undefined for non-positive numbers!");
                            return;
                        }
                        computation = Math.log10(current);
                        break;
                    case 'ln':
                        if (current <= 0) {
                            alert("Natural logarithm undefined for non-positive numbers!");
                            return;
                        }
                        computation = Math.log(current);
                        break;
                    case 'x²':
                        computation = Math.pow(current, 2);
                        break;
                    case 'x^3':
                        computation = Math.pow(current, 3);
                        break;
                    case '√':
                        if (current < 0) {
                            alert("Square root undefined for negative numbers!");
                            return;
                        }
                        computation = Math.sqrt(current);
                        break;
                    case '∛':
                        computation = Math.cbrt(current);
                        break;
                    case 'x!':
                        if (current < 0 || !Number.isInteger(current)) {
                            alert("Factorial is only defined for non-negative integers!");
                            return;
                        }
                        computation = this.factorial(current);
                        break;
                    case '10^x':
                        computation = Math.pow(10, current);
                        break;
                    case 'π':
                        computation = Math.PI;
                        break;
                    case 'e':
                        computation = Math.E;
                        break;
                    case '|x|':
                        computation = Math.abs(current);
                        break;
                    case '±':
                        computation = -current;
                        break;
                    case '%':
                        computation = current / 100;
                        break;
                    default:
                        return;
                }
                
                this.currentOperand = computation.toString();
                this.shouldResetScreen = true;
                this.isResult = true;
            }
            
            factorial(n) {
                if (n === 0 || n === 1) return 1;
                let result = 1;
                for (let i = 2; i <= n; i++) {
                    result *= i;
                }
                return result;
            }
            
            memoryClear() {
                this.memory = 0;
            }
            
            memoryRecall() {
                this.currentOperand = this.memory.toString();
                this.shouldResetScreen = true;
            }
            
            memoryAdd() {
                const current = parseFloat(this.currentOperand);
                if (!isNaN(current)) {
                    this.memory += current;
                }
            }
            
            memorySubtract() {
                const current = parseFloat(this.currentOperand);
                if (!isNaN(current)) {
                    this.memory -= current;
                }
            }
            
            memoryStore() {
                const current = parseFloat(this.currentOperand);
                if (!isNaN(current)) {
                    this.memory = current;
                }
            }
            
            toggleAngleMode() {
                this.isRadians = !this.isRadians;
                return this.isRadians ? 'RAD' : 'DEG';
            }
            
            getDisplayNumber(number) {
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                
                let integerDisplay;
                
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', {
                        maximumFractionDigits: 0
                    });
                }
                
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }
            
            updateDisplay() {
                this.currentOperandElement.innerText = this.getDisplayNumber(this.currentOperand);
                
                if (this.operation != null) {
                    this.previousOperandElement.innerText = 
                        `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
            }
        }
        
        // Initialize calculator
        const previousOperandElement = document.querySelector('.previous-operand');
        const currentOperandElement = document.querySelector('.current-operand');
        const calculator = new ScientificCalculator(previousOperandElement, currentOperandElement);
        
        // Add event listeners to buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', () => {
                if (button.classList.contains('clear')) {
                    calculator.clear();
                } else if (button.classList.contains('delete')) {
                    calculator.delete();
                } else if (button.classList.contains('operator')) {
                    calculator.chooseOperation(button.innerText);
                } else if (button.classList.contains('equals')) {
                    calculator.compute();
                } else if (button.classList.contains('function')) {
                    calculator.executeFunction(button.innerText);
                } else if (button.classList.contains('memory')) {
                    switch(button.innerText) {
                        case 'MC':
                            calculator.memoryClear();
                            break;
                        case 'MR':
                            calculator.memoryRecall();
                            break;
                        case 'M+':
                            calculator.memoryAdd();
                            break;
                        case 'M-':
                            calculator.memorySubtract();
                            break;
                        case 'MS':
                            calculator.memoryStore();
                            break;
                    }
                } else {
                    calculator.appendNumber(button.innerText);
                }
                
                calculator.updateDisplay();
            });
        });
        
        // Add keyboard support
        document.addEventListener('keydown', event => {
            if (event.key >= '0' && event.key <= '9' || event.key === '.') {
                calculator.appendNumber(event.key);
            } else if (event.key === '+' || event.key === '-' || event.key === '*') {
                calculator.chooseOperation(event.key === '*' ? '×' : event.key);
            } else if (event.key === '/') {
                event.preventDefault();
                calculator.chooseOperation('÷');
            } else if (event.key === 'Enter' || event.key === '=') {
                calculator.compute();
            } else if (event.key === 'Backspace') {
                calculator.delete();
            } else if (event.key === 'Escape') {
                calculator.clear();
            }
            
            calculator.updateDisplay();
        });
        
        // Toggle angle mode
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const newMode = calculator.toggleAngleMode();
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.toggle('active', b.textContent === newMode);
                });
            });
        });
    </script>
</body>
</html>
